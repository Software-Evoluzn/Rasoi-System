<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />

    <title>Register Product</title>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet"
        href="../static/css/scanner.css">

    <link rel="icon"
        type="image/png"
        href="../static/img/tab_logo.png">

    <!-- QR SCANNER -->
    
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

</head>

<body>

    <div class="scanner_card">

        <h1 class="scanner_card_title">
            Register Product
        </h1>

        <p class="scanner_card_subtitle">
            Scan QR code to link your product
        </p>

        <!-- SCANNER BOX -->
        <div class="scanner_box">

            <!-- CAMERA VIEW -->
            <div id="reader"></div>

            <!-- CAMERA ICON -->
            <div class="scanner_camera_icon">

                <svg viewBox="0 0 24 24"
                    fill="none"
                    stroke="#da83f5"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <path
                        d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />

                    <circle cx="12"
                        cy="13"
                        r="4" />

                </svg>

            </div>

            <!-- LABEL -->
            <span class="scanner_label">
                Scan Product QR Code
            </span>

            <!-- BUTTON -->
            <button class="scanner_open_btn">
                Open Scanner
            </button>

        </div>

        <!-- PRODUCT DETAILS -->
        <div class="scanner_info_block">

            <!-- SERIAL NUMBER -->
            <div class="scanner_info_row">

                <span class="scanner_info_label">
                    Serial Number
                </span>

                <span class="scanner_info_value"
                    id="serial_number">
                    -
                </span>

            </div>

            <!-- MODEL -->
            <div class="scanner_info_row">

                <span class="scanner_info_label">
                    Model Number
                </span>

                <span class="scanner_info_value"
                    id="model_name">
                    -
                </span>

            </div>

            <!-- MAC -->
            <div class="scanner_info_row">

                <span class="scanner_info_label">
                    MAC ID
                </span>

                <span class="scanner_info_value"
                    id="mac_id">
                    -
                </span>

            </div>

            <!-- DATE -->
            <div class="scanner_info_row">

                <span class="scanner_info_label">
                    Date of Purchase
                </span>

                <div class="scanner_date_wrap">

                    <input type="date"
                        class="scanner_date_input"
                        id="scanner_purchase_date" />

                </div>

            </div>

        </div>

        <!-- LINK BUTTON -->
        <button class="scanner_link_btn">
            Link Product
        </button>

        <!-- FOOTER -->
        <div class="scanner_footer_text">

            Powered by EVOLUZN

        </div>

    </div>

    <!-- JS -->
    <script src="../static/js/scanner.js"></script>

</body>

</html>
